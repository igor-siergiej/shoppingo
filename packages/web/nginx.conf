# Cache-Control per path. Chosen here rather than with add_header inside each location:
# nginx drops every server-level add_header in a location that declares its own, which
# silently stripped the security headers below from every response. Keep add_header out
# of the locations. An empty value sends no header (/api/ keeps the API's own caching).
map $uri $cache_control {
  ~^/api/                                                                 "";
  ~*^/(sw\.js|workbox-.*\.js)$                                            "no-cache, no-store, must-revalidate";
  ~*^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$    "public, max-age=31536000, immutable";
  ~*\.(png|jpg|jpeg|gif|ico|svg|webmanifest|txt)$                         "public, max-age=86400";
  default                                                                 "public, max-age=3600, must-revalidate";
}

server {
  listen 3000 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control $cache_control always;

  # Security headers. frame-ancestors lets the Umami dashboard (analytics.imapps.uk) frame
  # the app for heatmaps, so there is no X-Frame-Options DENY. The tracker and recorder load
  # same-origin from /pulse. img-src needs blob: for item images (useItemImage). Montserrat
  # is self-hosted (@fontsource-variable/montserrat), so fonts need no third-party origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self' https://analytics.imapps.uk; base-uri 'self'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Service Worker - never cached (see the map) so updates are picked up
  location ~* ^/(sw\.js|workbox-.*\.js)$ {
    try_files $uri =404;
  }

  # PWA Manifest (nginx's mime.types has no webmanifest entry)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # robots.txt — served as text/plain (mime.types) so crawlers parse it. Not
  # indexing the app itself (the marketing site owns the apex domain).
  location = /robots.txt {
    try_files $uri =404;
  }

  # Known static asset paths that should never fall back to the SPA shell.
  # The SPA fallback (location /, error_page 404) catches everything else,
  # so any file the user agent requests that we don't ship (e.g.
  # /sitemap.xml, /favicon.ico beyond our pngs, /apple-touch-icon.png,
  # /.well-known/*) should return a real 404 and not the index HTML that
  # would mislead crawlers and tooling. The block list is hand-maintained
  # because the SPA deliberately intercepts unknown paths for client-side
  # routes — adding paths here only when we explicitly decide "no asset,
  # never a route".
  location = /sitemap.xml { return 404; }
  location = /favicon.ico { return 404; }
  location = /apple-touch-icon.png { return 404; }
  location ~* ^/\.well-known/ { return 404; }

  # Static assets with versioned filenames - long cache (see the map)
  location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
  }

  # Images and icons - medium cache (see the map)
  location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
    try_files $uri =404;
  }

  # /api → api container. Needed for the self-host docker-compose to expose a
  # single port (4000) that serves both the SPA and the API. In production,
  # Traefik routes Host(app.tandra.uk) && PathPrefix(/api) to the api service
  # directly so this proxy_pass never fires — it is a safe addition.
  location /api/ {
    proxy_pass http://api:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # Main app - short cache with revalidation (see the map)
  location / {
    try_files $uri /index.html;
  }

  error_page 404 /index.html;
}