server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers for PWA
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.imapps.uk; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https: https://analytics.imapps.uk; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Service Worker - no cache to ensure updates
  location ~* ^/(sw\.js|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # PWA Manifest
  location = /manifest.webmanifest {
    add_header Content-Type "application/manifest+json" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # robots.txt — must be served as text/plain so crawlers parse it. Not
  # indexing the app itself (the marketing site owns the apex domain).
  location = /robots.txt {
    add_header Content-Type "text/plain" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Known static asset paths that should never fall back to the SPA shell.
  # The SPA fallback (location /, error_page 404) catches everything else,
  # so any file the user agent requests that we don't ship (e.g.
  # /sitemap.xml, /favicon.ico beyond our pngs, /apple-touch-icon.png,
  # /.well-known/*) should return a real 404 and not the index HTML that
  # would mislead crawlers and tooling. The block list is hand-maintained
  # because the SPA deliberately intercepts unknown paths for client-side
  # routes — adding paths here only when we explicitly decide "no asset,
  # never a route".
  location = /sitemap.xml { return 404; }
  location = /favicon.ico { return 404; }
  location = /apple-touch-icon.png { return 404; }
  location ~* ^/\.well-known/ { return 404; }

  # Static assets with versioned filenames - long cache
  location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Images and icons - medium cache
  location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # /api → api container. Needed for the self-host docker-compose to expose a
  # single port (4000) that serves both the SPA and the API. In production,
  # Traefik routes Host(imapps.uk) && PathPrefix(/api) to the api service
  # directly so this proxy_pass never fires — it is a safe addition.
  location /api/ {
    proxy_pass http://api:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  # Main app - short cache with revalidation
  location / {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    try_files $uri /index.html;
  }

  error_page 404 /index.html;
}