# Self-host everything from published Docker Hub images.
# Run from this directory: `cp .env.example .env && docker compose up -d`
# The web container (port 4000 on the host) serves the SPA and proxies /api/*
# to the api container (packages/web/nginx.conf).
name: shoppingo-selfhost

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot container that creates the bucket (a no-op when it already
  # exists); rustfs readiness gates it via the depends_on below.
  rustfs-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - internal
    entrypoint: ["sh", "-c"]
    command: >
      "rc alias set local http://rustfs:9000 ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY} &&
      rc bucket create --ignore-existing local/${BUCKET_NAME:-shoppingo}"
    restart: "no"

  kivo:
    image: igurusama/imapps:kivo-latest
    restart: unless-stopped
    environment:
      PORT: "3008"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: igurusama/imapps:shoppingo-api-latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      kivo:
        condition: service_healthy
    environment:
      PORT: "4001"
      AUTH_URL: "http://kivo:3008"
      # Better Auth env (kivo-replacement, see docs/superpowers/specs/2026-10-20-built-in-auth-design.md).
      # Required once the web cutover ships; before that the api boots without them and keeps
      # accepting kivo bearer tokens. Public origin of the web app, not the api container.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CONNECTION_URI: "mongodb://mongo:27017"
      DATABASE_NAME: ${DATABASE_NAME:-shoppingo}
      BUCKET_ENDPOINT: "rustfs:9000"
      BUCKET_NAME: ${BUCKET_NAME:-shoppingo}
      BUCKET_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      BUCKET_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      # AI features: leave FAL_KEY unset to disable recipe-import LLM, image
      # generation and substitutes. With no key the routes return upstream
      # errors; the UI flows that need them can be ignored or skipped.
      FAL_KEY: ${FAL_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-}
      FAL_RECIPE_MODEL: ${FAL_RECIPE_MODEL:-}
      WIKIBOOKS_USER_AGENT: ${WIKIBOOKS_USER_AGENT:-Shoppingo/1.0 (https://github.com/igor-siergiej/shoppingo)}
    networks:
      - internal

  web:
    image: igurusama/imapps:shoppingo-web-latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      # Single host port forwards to the web container, which proxies /api/*
      # to the api container. See packages/web/nginx.conf for the rule.
      - "${WEB_PORT:-4000}:3000"
    networks:
      - internal

volumes:
  mongo-data:
  rustfs-data:

networks:
  internal:
